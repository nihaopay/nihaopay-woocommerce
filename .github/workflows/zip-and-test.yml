name: Build NihaoPay WooCommerce Zip

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create zip package
        run: |
          DATE=$(date +'%Y%m%d')
          ZIPNAME="nihaopay-woocommerce-${DATE}.zip"
          zip -r "$ZIPNAME" . -x '*.git*' '*.github*' 'tests*' '*.DS_Store' '*.zip' '*.log'
          echo "ZIP_FILE=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload zip artifact
        uses: actions/upload-artifact@v2
        with:
          name: nihaopay-woocommerce-zip
          path: ${{ env.ZIP_FILE }} 